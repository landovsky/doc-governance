# .docgov/manifest.yml — per-repo docs-governance config.
#
# This file is the single source of truth for how the docs-governance model is
# wired into THIS repo. It is what `docgov migrate` (deferred CLI) will read to
# locate docs, build the index, and run the gate. Until the CLI lands, the
# values here document the intended layout and are used by the MANUAL workflow.
#
# Copied verbatim from payload/ at adopt time; fill the placeholders below.

# Version of the shared model this repo conforms to. Bumped by `docgov migrate`.
model_version: 0.3.1

# ISO date this repo adopted the model (set once, at adoption).
adopted_at: "<YYYY-MM-DD>"   # fill with the adoption date

# Default steward the governance loop notifies. Per-doc `owner:` is now an OPTIONAL
# override (v0.2.1) — set it on a doc only when its steward differs from this default.
owner: "@landovsky"          # fill with the repo's steward handle

# Where the governed artifacts live in this repo. Adjust to match the repo.
# One spelling per key, and every key unique across the WHOLE file (v0.3.0 / ADR-0001):
# the pre-0.3.0 parser matched keys line-wise with no path context, so `paths.index` and
# `options.index` were one key to it and this template resolved its index file to the
# literal string "manual". Hence `options.index_mode` below.
paths:
  docs_dir: docs              # root of governed documentation
  index: MAIN.md              # generated documentation index / map (`docgov index`)
  types: docs/_types.yml      # repo-local `type` vocabulary definitions
  decisions: docs/decisions   # the repo's ADR home — set to wherever ADRs live (docs/adr, …); feeds the ADR→reference edge
  doc_todo: .docgov/.doc-todo  # grandfather list of exempt pre-existing files

# Behavioural switches. `check`/`sweep`/`index` + CI are LIVE via the vendored bin/docgov;
# only the pinned pip install remains deferred.
options:
  tooling: vendored   # bin/docgov (copied from payload) provides `check` + `sweep` + `index`; pinned pip install deferred
  index_mode: auto    # the index's marked region is generated — `docgov index --write`, gated by `--check`
  ci: active          # .github/workflows/docs.yml runs `python3 bin/docgov check` on every PR
