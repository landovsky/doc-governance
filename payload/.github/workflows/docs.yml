# docs-governance CI — the real gate (pinned, dependency-free).
#
# `docgov` is NOT vendored into this repo's CI. Instead CI fetches the exact
# version pinned in `env.DOCGOV_VERSION` from a tagged release of the model repo.
# This makes the gate reproducible (a tag is immutable) and upgrades a one-line
# bump instead of a re-vendored file that silently drifts. A local `bin/docgov`
# may still exist for offline/dev runs, but this pin is the source of truth.
#
# Upgrade: bump DOCGOV_VERSION to a newer tag. Renovate can auto-open that PR —
#   add to renovate.json:
#     { "customManagers": [{
#         "customType": "regex",
#         "fileMatch": ["^\\.github/workflows/docs\\.yml$"],
#         "matchStrings": ["DOCGOV_VERSION:\\s*(?<currentValue>v[\\d.]+)"],
#         "depNameTemplate": "landovsky/doc-governance",
#         "datasourceTemplate": "github-tags" }] }
#
# Two tiers, matching model §9:
#   check  — BLOCKING structural gate: front matter, classes, tiers, covers[]
#            existence, on-use field contracts, dead internal links, ADR
#            heading==filename. (Still deferred: generated-index §9.2, retire-on-ship §9.4.)
#   drift  — NON-BLOCKING freshness sweep (§9.5): advises when a covers[] path
#            moved past last_verified. Never blocks a merge.
name: docs-governance

on:
  pull_request:
    paths:
      - "docs/**"
      - "MAIN.md"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".docgov/**"
      - ".github/workflows/docs.yml"   # so a DOCGOV_VERSION bump is itself gated
  schedule:
    - cron: "0 6 * * *"        # nightly freshness sweep
  workflow_dispatch:

env:
  # Pinned docgov version — an immutable git tag of the model repo. Bump to upgrade.
  DOCGOV_VERSION: v0.2.1
  DOCGOV_REPO: landovsky/doc-governance

jobs:
  check:                        # blocking gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch pinned docgov
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/${DOCGOV_REPO}/${DOCGOV_VERSION}/payload/bin/docgov" \
            -o /tmp/docgov
          chmod +x /tmp/docgov
      - name: docgov check
        run: python3 /tmp/docgov check

  drift:                        # advisory freshness sweep — never blocks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # sweep's commit-drift arm needs full history
      - name: fetch pinned docgov
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/${DOCGOV_REPO}/${DOCGOV_VERSION}/payload/bin/docgov" \
            -o /tmp/docgov
          chmod +x /tmp/docgov
      - name: docgov sweep (advisory)
        run: |
          python3 /tmp/docgov sweep | tee -a "$GITHUB_STEP_SUMMARY"
          python3 /tmp/docgov sweep --exit-code \
            || echo "::warning::docs drifted — a covers[] path changed since last_verified; a steward should re-read and re-attest."
