# docs-governance CI — the real gate (vendored, dependency-free).
#
# Two tiers, matching model §9:
#   check  — BLOCKING structural gate: front matter, classes, tiers, covers[]
#            existence, on-use field contracts, dead internal links, ADR
#            heading==filename. (Still deferred: generated-index verification
#            §9.2 and the retire-on-ship gate §9.4.)
#   drift  — NON-BLOCKING freshness sweep (§9.5): advises when a covers[] path
#            moved past last_verified. Never blocks a merge — re-attestation is
#            a steward's call, not a red build.
#
# `docgov` is vendored at bin/docgov; swap for a pinned `pipx install docgov==<ver>`
# once that ships (same check semantics).
name: docs-governance

on:
  pull_request:
    paths:
      - "docs/**"
      - "MAIN.md"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".docgov/**"
      - "bin/docgov"
  schedule:
    - cron: "0 6 * * *"        # nightly freshness sweep
  workflow_dispatch:

jobs:
  check:                        # blocking gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docgov check
        run: python3 bin/docgov check

  drift:                        # advisory freshness sweep — never blocks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # sweep's commit-drift arm needs full history
      - name: docgov sweep (advisory)
        run: |
          python3 bin/docgov sweep | tee -a "$GITHUB_STEP_SUMMARY"
          python3 bin/docgov sweep --exit-code \
            || echo "::warning::docs drifted — a covers[] path changed since last_verified; a steward should re-read and re-attest."
