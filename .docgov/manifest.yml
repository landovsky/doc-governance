# .docgov/manifest.yml — the MASTER package's OWN docs-governance config.
#
# The docs-governance package governs itself. This manifest wires the model into
# this very repo — locating the index, the type enum, and the grandfather list.
# (Shape mirrors payload/.docgov/manifest.yml; values here are real, not placeholders.)

# Version of the shared model THIS repo conforms to — and, being the master, defines.
model_version: 0.3.1

# ISO date the master adopted (dogfooded) its own model.
adopted_at: 2026-08-20

# Steward the governance loop notifies.
owner: "@landovsky"

# Where the governed artifacts live in the master. One spelling per key, and every key
# unique across the WHOLE file (v0.3.0 / ADR-0001): the pre-0.3.0 parser matched keys
# line-wise with no path context, so `paths.index` and `options.index` were the same key
# to it and the last one won. Hence `options.index_mode`, not `options.index`.
paths:
  index: MAIN.md               # the generated navigation index (`docgov index`)
  types: _types.yml            # the master's own repo-local `type` vocabulary
  decisions: docs/decisions    # the master's ADR home — decisions about the model itself
  doc_todo: .docgov/.doc-todo  # grandfather list of exempt pre-existing files
  governance: "spec/model.md + spec/front-matter.md (this IS the governance package)"  # no separate governance.md

# Behavioural switches.
options:
  tooling: vendored   # bin/docgov provides `check` + `sweep` + `index`; pinned pip install still deferred
  index_mode: auto    # MAIN.md's marked region is generated by `docgov index --write`
  ci: active          # .github/workflows/docs-governance.yml runs `docgov check` on every PR
